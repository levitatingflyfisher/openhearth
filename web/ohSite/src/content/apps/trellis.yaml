name: "Trellis"
kind: "Read, listen, study"
order: 11
c1: "#C47B6A"
c2: "#A85040"
line: "Read your own books and articles, listen to podcasts, and quiz yourself to remember."
desc: "One app for the household's whole knowledge diet. Bring in books, articles, podcasts, or anything shared from another app: episodes are transcribed on your own device. Read one word at a time, or follow along on the page as it is spoken, up to 4×, in the original or translated on your device. Then study what you keep: recall on a schedule that takes the hints away as it sticks, opening each concept only once the ones underneath it hold. Feeds are plain reverse-chronological and kept as a permanent archive: the app never develops an interest in your attention. Export to Anki any time."
pwa: "https://levitatingflyfisher.github.io/Trellis/"
apk: "https://github.com/levitatingflyfisher/Trellis/releases/latest/download/Trellis.apk"

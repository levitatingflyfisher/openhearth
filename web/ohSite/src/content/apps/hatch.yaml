line: "Children learn their times tables and hatch a critter for each one."
desc: "Times tables until they are automatic, not merely memorised. Every fact is an egg the child builds with her own hands (stack the rows, fold to double, slice a row off ten, rotate it into its slot) and answering it fast and right across enough separate days hatches it into a critter for the album. No streaks, no countdowns, no ads, no accounts; works offline."

name: sanctuary_backup_ui
description: Drop-in encrypted-backup UI (OHBK export/import) for OpenHearth apps,
  built on sanctuary_auth_core. Generic serializer interface + config + controller
  + the settings widgets, made app-agnostic.
publish_to: none
version: 0.3.0
environment:
  sdk: ^3.10.7
  flutter: '>=3.22.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: '>=2.6.1 <4.0.0'
  sanctuary_auth_core:
    path: ../sanctuary_auth_core
  flutter_secure_storage: ^9.2.2
  file_picker: '>=8.0.0 <11.0.0'
  share_plus: '>=10.0.0 <13.0.0'
  intl: ^0.20.2
  path_provider: ^2.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
resolution: workspace

name: openhearth_design
description: Design tokens, typography, tri-theme (light/hearthDark/night), elevation,
  and motion for all OpenHearth apps.
version: 0.14.0
publish_to: none
environment:
  sdk: ^3.10.7
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Lora
      fonts:
        - asset: fonts/Lora-Regular.ttf
        - asset: fonts/Lora-Italic.ttf
          style: italic
        - asset: fonts/Lora-Medium.ttf
          weight: 500
        - asset: fonts/Lora-Bold.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: fonts/Nunito-Regular.ttf
        - asset: fonts/Nunito-Medium.ttf
          weight: 500
        - asset: fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: fonts/Nunito-Bold.ttf
          weight: 700
resolution: workspace

name: hearth_sync
description: 'The OpenHearth sync kernel for Flutter apps: the Rust kernel over flutter_rust_bridge,
  a platform-held device key, and record stores over Drift and IndexedDB.'
version: 0.1.0
publish_to: none
environment:
  sdk: ^3.10.7
  flutter: '>=3.3.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  freezed_annotation: ^3.1.0
  cryptography: 2.9.0
  flutter_secure_storage: 9.2.4
  web: 1.1.1
  drift: '>=2.28.0 <3.0.0'
  idb_shim: ^2.6.0
  http: ^1.5.0
dev_dependencies:
  build_runner: '>=2.4.15 <2.14.0'
  freezed: ^3.1.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      linux:
        ffiPlugin: true

name: peckish
description: "The family food app \u2014 recipe box, weekly dinner plan, self-writing\
  \ grocery list, and a one-tap food diary. Local-first \u2014 OpenHearth."
publish_to: none
version: 0.10.1+15
environment:
  sdk: ^3.10.7
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  drift: ^2.18.0
  drift_flutter: ^0.2.2
  sqlite3_flutter_libs: ^0.5.24
  go_router: ^15.1.0
  http: ^1.2.1
  uuid: ^4.4.2
  intl: ^0.20.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  flutter_gemma: 1.0.0-rc.1
  google_mlkit_image_labeling: ^0.15.0
  image_picker: ^1.1.2
  dio: ^5.8.0
  wakelock_plus: ^1.5.2
  path: ^1.9.0
  sqlite3: ^2.9.4
  crypto: 3.0.8
  share_plus: ^12.0.2
  openhearth_design:
    path: ../../packages/ohStyle/openhearth_design
  sanctuary_auth_core:
    path: ../../packages/sanctuary_auth_core
  domovoi:
    path: ../../packages/domovoi
  sanctuary_backup_ui:
    path: ../../packages/sanctuary_backup_ui
  file_picker: ^10.3.8
  flutter_zxing: ^2.2.1
  flutter_secure_storage: ^9.2.4
  crdt: ^5.1.3
  shelf: ^1.4.2
  shelf_router: ^1.1.4
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  min_sdk_android: 24
  adaptive_icon_background: '#A85040'
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  web:
    generate: true
    image_path: assets/icon/app_icon.png
    background_color: '#FBF8F4'
    theme_color: '#A85040'
dev_dependencies:
  flutter_launcher_icons: ^0.14.1
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.12
  riverpod_generator: ^4.0.0
  drift_dev: ^2.18.0
  flutter_lints: ^6.0.0
  oh_fleet_conformance:
    path: ../../packages/oh_fleet_conformance
flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/food/
resolution: workspace

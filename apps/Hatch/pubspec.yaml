name: hatch
description: 'Hatch: where times tables hatch. Local-first, no ads, no accounts, no
  network.'
publish_to: none
version: 0.1.3+4
environment:
  sdk: ^3.10.7
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  go_router: ^15.1.0
  drift: ^2.18.0
  drift_flutter: ^0.2.2
  sqlite3_flutter_libs: ^0.5.24
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  path: ^1.9.0
  clock: ^1.1.1
  intl: ^0.20.2
  file_picker: ^10.3.8
  audioplayers: ^6.1.0
  pdf: ^3.11.0
  share_plus: ^12.0.2
  mastery_core:
    path: packages/mastery_core
  openhearth_design:
    path: ../../packages/ohStyle/openhearth_design
  sanctuary_auth_core:
    path: ../../packages/sanctuary_auth_core
  sanctuary_backup_ui:
    path: ../../packages/sanctuary_backup_ui
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.12
  riverpod_generator: ^4.0.0
  drift_dev: ^2.18.0
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  oh_fleet_conformance:
    path: ../../packages/oh_fleet_conformance
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: '#2C1810'
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/audio/
resolution: workspace

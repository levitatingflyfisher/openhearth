name: bulwark
description: "Local-first health-habit operating system \u2014 OpenHearth."
publish_to: none
version: 0.1.0+3
environment:
  sdk: ^3.10.7
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  drift: ^2.18.0
  drift_flutter: ^0.2.2
  sqlite3_flutter_libs: ^0.5.24
  go_router: ^15.1.0
  intl: ^0.20.2
  shared_preferences: ^2.3.2
  share_plus: ^12.0.2
  lucide_flutter: ^1.66.0
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  openhearth_design:
    path: ../../packages/ohStyle/openhearth_design
  sanctuary_auth_core:
    path: ../../packages/sanctuary_auth_core
  sanctuary_backup_ui:
    path: ../../packages/sanctuary_backup_ui
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  min_sdk_android: 21
  adaptive_icon_background: '#4E5D66'
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  web:
    generate: true
    image_path: assets/icon/app_icon.png
    background_color: '#F2EEE6'
    theme_color: '#4E5D66'
dev_dependencies:
  flutter_launcher_icons: ^0.14.1
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.12
  riverpod_generator: ^4.0.0
  drift_dev: ^2.18.0
  mocktail: ^1.0.5
  flutter_lints: ^6.0.0
  oh_fleet_conformance:
    path: ../../packages/oh_fleet_conformance
flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/content/
resolution: workspace

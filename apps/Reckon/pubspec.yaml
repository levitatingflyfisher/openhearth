name: reckon
description: A local-first personal decision journal with an on-device model.
publish_to: none
version: 0.2.0+4
environment:
  sdk: ^3.10.7
  flutter: '>=3.32.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  go_router: ^15.1.0
  drift: '>=2.28.0 <2.32.0'
  sqlite3: ^2.9.4
  sqlite3_flutter_libs: ^0.5.24
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.3
  path: ^1.9.0
  flutter_gemma: 1.0.0-rc.1
  fl_chart: ^0.70.2
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  uuid: ^4.4.0
  dio: ^5.4.3+1
  cryptography: 2.9.0
  http: ^1.2.0
  intl: ^0.20.2
  share_plus: ^12.0.2
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1
  nsd: ^4.1.0
  wakelock_plus: ^1.2.8
  domovoi:
    path: ../../packages/domovoi
  sanctuary_auth_core:
    path: ../../packages/sanctuary_auth_core
  sanctuary_backup_ui:
    path: ../../packages/sanctuary_backup_ui
  openhearth_design:
    path: ../../packages/ohStyle/openhearth_design
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  oh_fleet_conformance:
    path: ../../packages/oh_fleet_conformance
  reckonparty_relay:
    path: relay
  shelf: ^1.4.1
  build_runner: '>=2.4.15 <2.14.0'
  drift_dev: '>=2.28.0 <2.32.0'
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/reference_classes.json
    - assets/glossary.json
flutter_launcher_icons:
  image_path: assets/icon/scales_icon.png
  android: true
  ios: false
  min_sdk_android: 24
  adaptive_icon_background: '#EAEEF1'
  adaptive_icon_foreground: assets/icon/scales_foreground.png
  remove_alpha_ios: false
  web:
    generate: true
    image_path: assets/icon/scales_icon.png
    background_color: '#EAEEF1'
    theme_color: '#536B82'
resolution: workspace

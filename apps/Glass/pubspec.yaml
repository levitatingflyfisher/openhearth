name: glass
description: "WeatherGlass \u2014 a calm, local-first FLOSS weather app. Read the\
  \ sky, tell no one."
publish_to: none
version: 0.1.0+3
environment:
  sdk: ^3.10.7
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  drift: ^2.18.0
  drift_flutter: ^0.2.2
  sqlite3_flutter_libs: ^0.5.24
  go_router: ^15.1.0
  uuid: ^4.4.2
  intl: ^0.20.2
  shared_preferences: ^2.3.2
  http: ^1.2.0
  geolocator: ^13.0.1
  lucide_flutter: ^1.7.0
  openhearth_design:
    path: ../../packages/ohStyle/openhearth_design
  sanctuary_auth_core:
    path: ../../packages/sanctuary_auth_core
  sanctuary_backup_ui:
    path: ../../packages/sanctuary_backup_ui
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  min_sdk_android: 21
  adaptive_icon_background: '#E0EBF6'
  adaptive_icon_foreground: assets/icon/app_icon_fg.png
  web:
    generate: true
    image_path: assets/icon/app_icon.png
    background_color: '#F7FAFC'
    theme_color: '#3D82C9'
dev_dependencies:
  flutter_launcher_icons: ^0.14.1
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.12
  riverpod_generator: ^4.0.0
  drift_dev: ^2.18.0
  flutter_lints: ^6.0.0
  oh_fleet_conformance:
    path: ../../packages/oh_fleet_conformance
flutter:
  uses-material-design: true
  assets:
    - assets/icon/
resolution: workspace

name: one_second_a_day
description: Capture one second of video every day. Retro aesthetic, local-first.
publish_to: none
version: 1.5.0+8
environment:
  sdk: ^3.10.7
dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  video_player: ^2.8.2
  image: '>=4.0.0 <4.9.0'
  media_scanner: ^2.1.0
  photo_manager: ^3.6.0
  ffmpeg_kit_flutter_new: ^4.1.0
  file_picker: ^10.3.8
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  geolocator: ^13.0.2
  google_mlkit_face_detection: ^0.12.0
  tflite_flutter: ^0.11.0
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  archive: ^4.0.0
  sanctuary_backup_ui:
    path: ../../packages/sanctuary_backup_ui
  sanctuary_auth_core:
    path: ../../packages/sanctuary_auth_core
  share_plus: ^12.0.2
  cryptography: 2.9.0
  home_widget: ^0.7.0
  intl: ^0.20.2
  uuid: ^4.3.3
  openhearth_design:
    path: ../../packages/ohStyle/openhearth_design
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  oh_fleet_conformance:
    path: ../../packages/oh_fleet_conformance
  path_provider_platform_interface: ^2.1.2
flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/models/
    - assets/data/
    - assets/fonts/
  fonts:
    - family: VT323
      fonts:
        - asset: assets/fonts/VT323-Regular.ttf
    - family: Press Start 2P
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf
    - family: Roboto Mono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf
        - asset: assets/fonts/RobotoMono-Bold.ttf
          weight: 700
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icons/app_icon_foreground.png
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: assets/icons/app_icon_foreground.png
resolution: workspace

name: furrow
description: "Local-first daily-virtue & habit tracker \u2014 OpenHearth."
publish_to: none
version: 0.2.0+4
environment:
  sdk: ^3.10.7
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  drift: ^2.18.0
  drift_flutter: ^0.2.2
  sqlite3_flutter_libs: ^0.5.24
  go_router: ^15.1.0
  uuid: ^4.4.2
  intl: ^0.20.2
  clock: ^1.1.1
  shared_preferences: ^2.3.2
  confetti: ^0.7.0
  lucide_flutter: ^1.7.0
  openhearth_design:
    path: ../../packages/ohStyle/openhearth_design
  file_picker: ^10.3.8
  home_widget: ^0.7.0
  sanctuary_auth_core:
    path: ../../packages/sanctuary_auth_core
  sanctuary_backup_ui:
    path: ../../packages/sanctuary_backup_ui
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  min_sdk_android: 21
  adaptive_icon_background: '#6E4A19'
  adaptive_icon_foreground: assets/icon/app_icon.png
dev_dependencies:
  flutter_launcher_icons: ^0.14.1
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.12
  riverpod_generator: ^4.0.0
  drift_dev: ^2.18.0
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0
  oh_fleet_conformance:
    path: ../../packages/oh_fleet_conformance
flutter:
  uses-material-design: true
  assets:
    - assets/icon/
resolution: workspace

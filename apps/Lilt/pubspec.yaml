name: lilt
description: Baby name ranking for couples. Local-first, no account required.
publish_to: none
version: 1.0.0+3
environment:
  sdk: ^3.10.7
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  go_router: ^15.1.0
  drift: ^2.25.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.5
  path: ^1.9.1
  elo_engine:
    path: ../../packages/elo_engine
  openhearth_design:
    path: ../../packages/ohStyle/openhearth_design
  uuid: ^4.5.1
  share_plus: ^12.0.2
  shared_preferences: ^2.3.4
  sanctuary_auth_core:
    path: ../../packages/sanctuary_auth_core
  sanctuary_backup_ui:
    path: ../../packages/sanctuary_backup_ui
dev_dependencies:
  flutter_test:
    sdk: flutter
  oh_fleet_conformance:
    path: ../../packages/oh_fleet_conformance
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.25.0
  sqlite3: ^2.9.4
flutter:
  uses-material-design: true
  assets:
    - assets/data/names.json
resolution: workspace

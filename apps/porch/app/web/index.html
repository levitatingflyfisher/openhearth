<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!-- porch keeps its keys in this origin's browser storage, so only
       porch's own files may run here. 'wasm-unsafe-eval' lets libsodium and
       CanvasKit compile their WebAssembly. connect-src allows any https
       address because the relay's address is not fixed yet.
       style-src 'unsafe-inline': Flutter's engine adds its own <style>
       elements at start-up, and the boot screen below has one. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' https:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Porch is the porch light for your friend group: tap once to say you’re around, see who else is. Presence, not chat, end-to-end encrypted, no accounts. This web build is a preview with weaker key storage than the Android app.">
  <meta name="theme-color" content="#845416">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Porch">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Tell your people you’re around · Porch</title>
  <link rel="manifest" href="manifest.json">
  <style>
#oh-boot{position:fixed;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;padding:0 24px;text-align:center;background:#FBF8F4;color:#2C1810;font-family:sans-serif;z-index:99999;transition:opacity .35s ease}
#oh-boot h1{margin:8px 0 0;font-size:20px;font-weight:600}
#oh-boot p{margin:0;max-width:32em;font-size:15px;line-height:1.4;color:#6E5F4C}
#oh-boot .s{width:42px;height:42px;border:3px solid #EAE1D4;border-top-color:#845416;border-radius:50%;animation:ohspin .8s linear infinite}
@keyframes ohspin{to{transform:rotate(360deg)}}
@media(prefers-color-scheme:dark){#oh-boot{background:#1C1007;color:#F5EFE6}#oh-boot p{color:#C7B9A0}#oh-boot .s{border-color:#3A2215;border-top-color:#FBBA73}}
</style>
  <script src="boot.js"></script>
  <!-- sodium sumo (libsodium.js) — injected by `dart run sodium_libs:update_web
       --sumo`; required for SodiumSumoInit.init() at runtime. Keep on redeploy. -->
  <script type="text/javascript" src="sodium.js" async="true"></script>
</head>
<body>
<div id="oh-boot"><div class="s"></div>
  <h1>Porch</h1>
  <p>The porch light for your friend group. Tap once to say you’re around, and see which of your people are too. No chat, no feed, no accounts: your groups live on your phone, end-to-end encrypted.</p>
</div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

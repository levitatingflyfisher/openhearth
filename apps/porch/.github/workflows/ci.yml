name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

# The token may only read the repo. Actions are pinned by full commit
# hash (a tag can be moved to other code); the tag is in the comment.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relay:
    name: Relay (go vet + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (the v4 tag)
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0 (the v5 tag)
        with:
          go-version-file: relay/go.mod
      - run: go vet ./...
      # The Redis conformance leg skips visibly without REDIS_URL.
      - run: go test ./...

  app:
    name: App (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (the v4 tag)

      - name: Clone the sibling path-dep packages
        # app/ depends on these by path (../../ohStyle, ../../packages/...),
        # matching the local OpenHearth layout. They land one level above
        # the checkout, which the runner owns.
        working-directory: .
        run: |
          git clone --depth 1 https://github.com/levitatingflyfisher/ohStyle ../ohStyle
          git clone --depth 1 https://github.com/levitatingflyfisher/ohFleetConformance ../packages/oh_fleet_conformance

      - name: Host libsodium (domain and data tests run on the Dart VM)
        run: sudo apt-get update && sudo apt-get install -y libsodium23

      # relayd_integration_test compiles the real Go relay.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0 (the v5 tag)
        with:
          go-version-file: relay/go.mod

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0 (the v2 tag)
        with:
          flutter-version: '3.38.7'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze

      # Pixel goldens are tagged and compared locally only (font
      # rasterisation differs across machines); their overflow sweep still
      # runs here, with the pixel comparison turned into a rewrite.
      - run: flutter test --exclude-tags golden
      - run: flutter test --tags golden --update-goldens
